<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuAPI Prompt Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 min-h-screen text-gray-100">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-gray-950/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center">
          <i class="fas fa-bolt text-white text-sm"></i>
        </div>
        <h1 class="text-lg font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
          MuAPI Prompt Generator
        </h1>
      </div>
      <div class="flex items-center gap-4">
        <span id="modelCount" class="text-xs text-gray-500"></span>
        <span id="connectionStatus" class="text-xs">
          <i class="fas fa-circle text-gray-600 text-[8px]"></i>
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Tab Navigation -->
    <div class="flex gap-1 mb-6 bg-gray-900 rounded-lg p-1 w-fit">
      <button id="tabImage" class="tab-btn active" data-tab="image">
        <i class="fas fa-image mr-1.5"></i> Image
      </button>
      <button id="tabVideo" class="tab-btn" data-tab="video">
        <i class="fas fa-video mr-1.5"></i> Video
      </button>
      <button id="tabOther" class="tab-btn" data-tab="other">
        <i class="fas fa-ellipsis mr-1.5"></i> More
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Left Panel: Model Selection + Params -->
      <div class="lg:col-span-5 space-y-4">

        <!-- Model Selector -->
        <div class="card">
          <label class="label"><i class="fas fa-brain mr-1"></i> Model</label>
          <div class="relative">
            <input id="modelSearch" type="text" class="input" placeholder="Search 690 models...">
            <div id="modelDropdown" class="dropdown hidden">
              <!-- populated by JS -->
            </div>
          </div>
          <select id="modelSelect" class="input mt-2 hidden">
            <!-- populated by JS -->
          </select>
          <div id="modelInfo" class="mt-2 text-xs text-gray-500 hidden">
            <span id="modelCategory" class="badge"></span>
            <span id="modelCost" class="ml-2"></span>
          </div>
        </div>

        <!-- Dynamic Parameters -->
        <div id="paramsContainer" class="card hidden">
          <label class="label"><i class="fas fa-sliders-h mr-1"></i> Parameters</label>
          <div id="paramsForm" class="space-y-3">
            <!-- dynamically generated -->
          </div>
        </div>

        <!-- Prompt Input -->
        <div class="card">
          <label class="label"><i class="fas fa-pen mr-1"></i> Prompt</label>
          <textarea id="promptInput" class="input h-28 resize-y" placeholder="Describe what you want to generate..."></textarea>
          <div class="flex gap-2 mt-2">
            <button id="btnEnhance" class="btn-secondary text-xs" title="Enhance prompt with AI">
              <i class="fas fa-magic mr-1"></i> Enhance
            </button>
            <button id="btnClear" class="btn-secondary text-xs">
              <i class="fas fa-eraser mr-1"></i> Clear
            </button>
          </div>
        </div>

        <!-- Generate Button -->
        <button id="btnGenerate" class="btn-primary w-full" disabled>
          <i class="fas fa-play mr-2"></i> Generate
        </button>

        <!-- Cost Estimate -->
        <div id="costEstimate" class="text-center text-xs text-gray-500 hidden">
          Estimated cost: <span id="costValue" class="text-purple-400 font-mono"></span>
        </div>
      </div>

      <!-- Right Panel: Output + Status -->
      <div class="lg:col-span-7 space-y-4">

        <!-- Status -->
        <div id="statusCard" class="card hidden">
          <div class="flex items-center gap-3">
            <div id="statusSpinner" class="spinner hidden"></div>
            <div>
              <div id="statusText" class="text-sm font-medium"></div>
              <div id="statusDetail" class="text-xs text-gray-500 mt-0.5"></div>
            </div>
          </div>
          <div id="progressBar" class="mt-3 h-1 bg-gray-800 rounded-full overflow-hidden hidden">
            <div id="progressFill" class="h-full bg-gradient-to-r from-purple-500 to-pink-500 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>

        <!-- Output Display -->
        <div id="outputCard" class="card hidden">
          <div class="flex items-center justify-between mb-3">
            <label class="label mb-0"><i class="fas fa-image mr-1"></i> Output</label>
            <div class="flex gap-2">
              <button id="btnCopyUrl" class="btn-secondary text-xs" title="Copy URL">
                <i class="fas fa-copy"></i>
              </button>
              <button id="btnDownload" class="btn-secondary text-xs" title="Download">
                <i class="fas fa-download"></i>
              </button>
              <button id="btnOpenNew" class="btn-secondary text-xs" title="Open in new tab">
                <i class="fas fa-external-link-alt"></i>
              </button>
            </div>
          </div>
          <div id="outputContent" class="rounded-lg overflow-hidden bg-gray-900 min-h-[200px] flex items-center justify-center">
            <!-- image or video output -->
          </div>
          <div id="outputMeta" class="mt-2 text-xs text-gray-500 flex gap-4">
            <!-- cost, time, etc. -->
          </div>
        </div>

        <!-- Generated Prompt Preview -->
        <div class="card">
          <label class="label"><i class="fas fa-code mr-1"></i> API Payload</label>
          <pre id="payloadPreview" class="text-xs font-mono bg-gray-950 rounded-lg p-3 overflow-auto max-h-64 text-gray-400">{ "prompt": "..." }</pre>
          <button id="btnCopyPayload" class="btn-secondary text-xs mt-2">
            <i class="fas fa-copy mr-1"></i> Copy JSON
          </button>
        </div>

        <!-- History -->
        <div class="card">
          <label class="label"><i class="fas fa-history mr-1"></i> Recent</label>
          <div id="historyList" class="space-y-2 max-h-48 overflow-y-auto">
            <p class="text-xs text-gray-600">No generations yet.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
