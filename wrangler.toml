name = "muapi-prompt-generator"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
# Built React client (client/dist), served from the edge cache.
# Rebuild with `npm --prefix client run build` before deploying.
directory = "client/dist"

[[d1_databases]]
binding = "DB"
database_name = "muapi-models"
# Environment-specific. Replace with the id from `wrangler d1 create` on a fork.
database_id = "bf6aa067-463a-45ba-91b3-d240dec91385"

[[d1_databases]]
binding = "HISTORY"
database_name = "genai-history"
# Environment-specific. Replace with the id from `wrangler d1 create` on a fork.
database_id = "6a271502-ea90-411b-935c-50a16d5d5300"

[[r2_buckets]]
binding = "OUTPUTS_BUCKET"
bucket_name = "genai-assets"

[vars]
MUAPI_BASE_URL = "https://api.muapi.ai/api/v1"
# Repos the /api/hf/file proxy may serve, as comma-separated owner/repo or
# owner/* entries. EMPTY BY DEFAULT, and that is the correct setting unless you
# have a PRIVATE LoRA that the provider cannot fetch on its own.
#
# With this empty no rewriting happens at all: a HuggingFace URL entered in a
# LoRA field is passed through to MuAPI exactly as typed, and MuAPI fetches it
# from the Hub. That is the right path for every PUBLIC adapter - including
# public repos you own - and it needs nothing from this Worker.
#
# Only set this when a repo is genuinely private or gated, so the provider's
# own fetchers get a 403 and this Worker has to fetch it with the HF token
# instead. Two prerequisites, both easy to miss:
#   1. An Access BYPASS must cover /api/hf/file. If an Access application
#      covers the whole hostname without a bypass, the provider receives a login
#      page instead of the weights and the job hangs at "starting" forever.
#   2. The URL must contain /resolve/main/<file>. The bare owner/repo form
#      carries no filename, so it is deliberately NOT rewritten - the worker
#      cannot know which weight file to ask for.
#
# Every repo currently in the LoRA library, including Sentinel7/qwen-image and
# D33pStateTech/*, was verified readable anonymously, so none of them NEED the
# proxy. They are listed anyway so that a full /resolve/ URL for any of them is
# guaranteed to keep working even if the owner later makes a repo private, and
# so the mechanism is exercised rather than dormant.
#
# Verified 2026-10-03: Sentinel7/qwen-image returns gated=false and serves every
# weight anonymously, including nested paths such as
# 2004155/2611939/Qwen4Play-2512.1_e10.safetensors. It was previously assumed to
# be private because two Sentinel7 repo NAMES return 401 - those names simply do
# not exist; they are library display ids, not real repos.
HF_PROXY_REPO_ALLOWLIST = "D33pStateTech/*,Sentinel7/*"
# Canonical origin to advertise when rewriting HuggingFace URLs to the proxy.
# Leave empty to use the incoming request origin. Set this when preview
# deployments get ephemeral hostnames that upstream fetchers cannot reach.
HF_PROXY_BASE_URL = ""
